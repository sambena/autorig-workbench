<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<!-- Autorig Workbench: the spec editor. A model's rig.json as a form, beside the source model and its own skeleton
     in 3D: click a bone to see what it is, press Pick beside a field and click bones (or points on the model) to fill
     it, then Save, or Save and re-rig and compare the audit before and after. Served by gui/server.py
     (gui/spec_api.py); three.js is vendored under gui/vendor/three (MIT). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autorig Workbench - spec editor</title>
<style>
:root {
  --bg: #15181e; --ink: #e6e9ef; --muted: #98a2b3; --panel: #1b1f27; --panel2: #20252f; --line: #2c3340;
  --accent: #5b8ff0; --accent-ink: #0b0e14; --warn: #e8b64a; --warn-bg: #3a2f14; --ok: #4cc17e; --ok-bg: #173323;
  --bad: #f07070; --bad-bg: #3a1a1a; --chip: #252b36; --hud: rgba(20, 23, 30, .86);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
             font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body { display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
header { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-bottom: 1px solid var(--line);
         background: var(--panel); flex-wrap: wrap; min-width: 0; }
header h1 { font-size: 15px; margin: 0; font-weight: 650; }
header .meta { color: var(--muted); font-size: 12px; }
header .grow { flex: 1; }
button { font: inherit; color: var(--ink); background: var(--chip); border: 1px solid var(--line); border-radius: 6px;
         padding: 4px 10px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.small { padding: 1px 7px; font-size: 12px; }
button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.picking { background: var(--warn); color: #1a1405; border-color: var(--warn); }
a { color: var(--accent); }
#dirty { color: var(--warn); font-size: 12px; }
main { display: grid; grid-template-columns: 1fr 470px; min-height: 0; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; grid-template-rows: 50vh 1fr; } }
#view { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
#stage { position: absolute; inset: 0; }
#stage canvas { display: block; }
.hud { position: absolute; background: var(--hud); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
       font-size: 12.5px; }
#viewbar { left: 10px; bottom: 10px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; max-width: calc(100% - 20px); }
#viewbar label { color: var(--muted); display: flex; gap: 4px; align-items: center; }
#legend { left: 10px; top: 10px; max-width: 260px; }
#legend .row { display: flex; gap: 6px; align-items: center; }
#legend .sw { width: 12px; height: 4px; border-radius: 2px; flex: none; }
#legend h4, #boneinfo h4 { margin: 0 0 3px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
#boneinfo { right: 10px; top: 10px; width: 270px; display: none; }
#boneinfo .n { font-size: 15px; font-weight: 650; }
#boneinfo .sub { color: var(--muted); }
#boneinfo .acts { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
#banner { left: 50%; top: 10px; transform: translateX(-50%); display: none; background: var(--warn-bg); color: var(--warn);
          border-color: var(--warn); font-weight: 600; text-align: center; max-width: 60%; }
#banner button { margin-left: 8px; }
#msg { left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; display: none; max-width: 440px; padding: 14px 18px; }
#msg .big { font-size: 15px; margin-bottom: 6px; }
.lbl { font: 11px/1 system-ui, sans-serif; color: #e8edf6; background: rgba(10, 12, 18, .86); padding: 2.5px 5px;
       border-radius: 4px; white-space: nowrap; pointer-events: auto; cursor: pointer; border-left: 3px solid #666;
       box-shadow: 0 2px 6px rgba(0,0,0,.5); }
.lbl.sel { background: #5b8ff0; color: #0b0e14; font-weight: 650; }
.lbl.dim { opacity: .5; }
#view.pointpick .lbl { pointer-events: none; }
#view.pointpick canvas { cursor: crosshair; }
.lbl.spot { background: rgba(90, 16, 16, .9); border-left-color: #ff4a4a; color: #ffd9d9; }
aside { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 8px; flex: none; }
.tabs button { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 7px 9px; color: var(--muted); }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); background: none; }
.tabs .count { font-size: 10.5px; border-radius: 8px; padding: 0 5px; margin-left: 3px; background: var(--bad-bg); color: var(--bad); }
.tabs .count.w { background: var(--warn-bg); color: var(--warn); }
#pane { overflow: auto; padding: 8px 12px 30px; flex: 1; min-height: 0; }
.group { margin: 6px 0 12px; }
.group > h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 12px 0 4px;
              border-bottom: 1px solid var(--line); padding-bottom: 3px; cursor: pointer; user-select: none; }
.group > h3::before { content: "▾ "; }
.group.shut > h3::before { content: "▸ "; }
.group.shut > .fields { display: none; }
.field { padding: 5px 0 7px; border-bottom: 1px dashed rgba(255,255,255,.04); }
.field > .lab { display: flex; align-items: center; gap: 6px; font-weight: 600; }
.field > .lab .grow { flex: 1; }
.field .help { color: var(--muted); font-size: 12px; margin: 1px 0 4px; }
.field.err { background: linear-gradient(90deg, rgba(240,112,112,.08), transparent); }
.field .ferr { color: var(--bad); font-size: 12px; }
.field .fwarn { color: var(--warn); font-size: 12px; }
input[type=text], input[type=number], select, textarea { font: inherit; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; }
input[type=number] { width: 78px; }
input.pt { width: 58px; }
textarea { width: 100%; font: 12px/1.4 ui-monospace, Consolas, monospace; min-height: 60px; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; min-height: 24px; }
.chip { display: inline-flex; align-items: center; gap: 3px; background: var(--chip); border: 1px solid var(--line);
        border-radius: 12px; padding: 1px 4px 1px 8px; font-size: 12px; cursor: pointer; border-left: 4px solid #666; }
.chip b { font-weight: 600; }
.chip .x { color: var(--muted); padding: 0 4px; border-radius: 8px; }
.chip .x:hover { color: var(--bad); background: var(--bad-bg); }
.chip.empty { color: var(--muted); border-style: dashed; cursor: default; border-left-width: 1px; padding-right: 8px; }
.sub-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 3px 0; padding: 4px 6px; background: var(--panel2);
           border-radius: 6px; }
.sub-row .grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); }
.card { background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; margin: 6px 0; }
.card .hd { display: flex; gap: 6px; align-items: center; }
pre.diff { font: 12px/1.45 ui-monospace, Consolas, monospace; background: #0e1116; border-radius: 6px; padding: 8px;
           white-space: pre-wrap; overflow-wrap: anywhere; margin: 6px 0; }
pre.diff .add { color: #7ee0a0; background: rgba(76,193,126,.08); display: block; }
pre.diff .del { color: #f39a9a; background: rgba(240,112,112,.08); display: block; }
pre.diff .at { color: #8fb0f5; display: block; }
pre.log { font: 11.5px/1.4 ui-monospace, Consolas, monospace; background: #0b0d12; color: #c9d1e0; border-radius: 6px;
          padding: 8px; height: 230px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; margin: 6px 0; }
.problems li { margin: 2px 0; }
.problems .p { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; color: var(--muted); }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); }
th { font-size: 11px; text-transform: uppercase; color: var(--muted); font-weight: 600; }
td.num { font-variant-numeric: tabular-nums; }
.good { color: var(--ok); } .worse { color: var(--bad); }
.verdict { display: inline-block; font-weight: 700; padding: 1px 8px; border-radius: 5px; }
.verdict.pass { background: var(--ok-bg); color: var(--ok); } .verdict.fail { background: var(--bad-bg); color: var(--bad); }
.note { background: var(--warn-bg); color: var(--warn); border-radius: 6px; padding: 6px 9px; margin: 6px 0; font-size: 12.5px; }
.note.info { background: #1d2a44; color: #b9cdf7; }
.spotlist li { cursor: pointer; margin: 2px 0; }
.spotlist li:hover { color: var(--accent); }
#flat { position: relative; }
#flat.large { position: fixed; left: 10px; top: 54px; width: calc(100vw - 500px); z-index: 100; background: #f7f7f7;
              border-radius: 6px; box-shadow: 0 6px 30px rgba(0,0,0,.6); }
#flat img { width: 100%; display: block; border-radius: 5px; cursor: crosshair; background: #f7f7f7; }
#flat canvas { position: absolute; left: 0; top: 0; pointer-events: none; }
.state.done { color: var(--ok); } .state.failed, .state.cancelled { color: var(--bad); } .state.running, .state.queued { color: var(--warn); }
kbd { font: 11px ui-monospace, Consolas, monospace; background: var(--chip); border: 1px solid var(--line); border-radius: 3px; padding: 0 3px; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<header>
  <h1 id="title">Spec editor</h1>
  <span class="meta" id="sub"></span>
  <span id="dirty"></span>
  <span class="grow"></span>
  <button id="bUndo" title="Undo the last change (Ctrl+Z)" disabled>Undo</button>
  <button id="bRevert" title="Throw away the changes: back to the rig.json on disk">Revert</button>
  <button id="bSuggest" title="Heuristically suggest an archetype and chains from survey, proportions, and tips">Suggest skeleton</button>
  <button id="bAutoTune" title="Closed-loop auto-tuning optimizer: iteratively heals tears and tunes joint blend, radii, and bone placement to pass audit">Auto-tune</button>
  <button id="bSave" title="Write rig.json (the old one is kept as rig.json.bak)">Save</button>
  <button id="bRerig" class="primary" title="Save, then rig, trim, audit, clips and preview: compare the audit before and after">Save and re-rig</button>
  <button id="bView" title="Open the 3D results viewer on the rig">View results</button>
  <a id="helpLink" href="#" target="_blank"><button type="button" title="Comprehensive guide with diagrams, bone placement, and troubleshooting">Help ↗</button></a>
  <a id="back" href="#">workbench</a>
</header>
<main>
  <section id="view">
    <div id="stage"></div>
    <div class="hud" id="legend"></div>
    <div class="hud" id="boneinfo"></div>
    <div class="hud" id="banner"><span id="bannerText"></span><button id="bannerNext" class="small" title="In the flat views: go on to the next point">Next point</button><button id="bannerDone" class="small">Done</button></div>
    <div class="hud" id="msg"><div class="big" id="msgBig"></div><div class="muted" id="msgSub"></div><div id="msgAct" style="margin-top:10px"></div></div>
    <div class="hud" id="viewbar">
      <span style="display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden;">
        <button id="vSource" class="small on" title="Source mesh and skeleton to edit the spec">Source</button>
        <button id="vRigged" class="small" title="Rigged mesh and animated clips">Rigged &amp; Clips</button>
      </span>
      <span id="clipBar" style="display:none; align-items:center; gap:6px;">
        <select id="clipSelect" class="small"></select>
        <button id="clipPlay" class="small" title="Play / Pause">▶</button>
        <span id="clipTime" class="meta" style="font-size:11px"></span>
        <input type="range" id="clipScrub" min="0" max="1000" step="1" value="0" style="width:90px" title="Scrub frame">
      </span>
      <button id="vFront" class="small" title="Look at its face">Front</button>
      <button id="vSide" class="small" title="From its left side">Side</button>
      <button id="vTop" class="small" title="From above">Top</button>
      <label title="How see-through the model is">model <input type="range" id="opacity" min="0.1" max="1" step="0.05" value="1"></label>
      <label title="Show or hide source skeleton bone names (e.g. Mixamo/Tripo)"><input type="checkbox" id="showSourceLabels"> <span id="lblSourceNames">Mixamo labels</span></label>
      <label title="Show or hide suggested spec chain and guide labels"><input type="checkbox" id="showSuggestedLabels" checked> suggested labels</label>
      <label title="Show or hide height and span guide lines in 3D"><input type="checkbox" id="showGuides" checked> guides</label>
      <label title="Show or hide audit issue spots in 3D"><input type="checkbox" id="showSpots" checked> audit spots</label>
      <label title="Clicking the model places a point halfway through the part under the mouse (a limb's middle), or on its surface"><input type="checkbox" id="throughMiddle" checked> points in the middle</label>
      <label title="Mirror point edits across X=0.5 symmetry plane to opposite .L/.R chain"><input type="checkbox" id="mirrorEdits" checked> mirror .L/.R</label>
      <span id="poseTestBar" style="display:inline-flex; align-items:center; gap:5px; border-left:1px solid var(--line); padding-left:8px; margin-left:4px;">
        <label title="Preview limb bending and skin deformation in real time before rerigging"><input type="checkbox" id="poseTestToggle"> bend test</label>
        <select id="poseChainSelect" class="small" style="display:none; max-width:110px"></select>
        <input type="range" id="poseAngle" min="-90" max="90" step="1" value="0" style="display:none; width:80px" title="Bend angle (-90° to +90°)">
        <span id="poseAngleVal" class="meta" style="display:none; font-size:11px; min-width:26px">0°</span>
        <button id="poseReset" class="small" style="display:none; padding:1px 5px;" title="Reset bend angle to 0°">Reset</button>
      </span>
    </div>
  </section>
  <aside>
    <div class="tabs" id="tabs"></div>
    <div id="pane"></div>
  </aside>
</main>
<script>window.AUTORIG_TOKEN = "__AUTORIG_TOKEN__";</script>
<script type="module" src="./spec_editor.js"></script>
</body>
</html>
